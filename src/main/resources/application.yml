spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/cinema
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  booking:
    hold-ttl: PT10M